# Netlify-Konfiguration für die Joythe & Richert Website.
# Die Seite liegt im Unterordner joythe-richert-website (Monorepo) und hat
# keinen Build-Step – Netlify deployt die statischen Dateien direkt.

[build]
  publish = "joythe-richert-website"

# Die Vokabel-App liegt im selben Repo, aber in vokabel-app/ und mit Build-Step.
# Dieser Kontext gilt ausschließlich für Deploys des Branch "vokabel-app" — die
# Joythe-&-Richert-Seite (main) bleibt unberührt.
#
# Warum hier und nicht nur in vokabel-app/netlify.toml: Netlify liest zuerst
# diese Datei im Repo-Wurzelverzeichnis. Ohne gesetztes Base-Verzeichnis würde
# der Vokabel-App-Site sonst das `publish` der anderen Seite erben und der Build
# scheitern, bevor die zweite netlify.toml überhaupt drankommt. Mit diesem
# Kontext läuft das Deployment unabhängig davon, was im Netlify-UI eingetragen
# ist — vorausgesetzt, das Feld „Base directory" bleibt LEER.
[context."vokabel-app"]
  command = "cd vokabel-app && npm ci && npm run build"
  publish = "vokabel-app/dist"

[context."vokabel-app".environment]
  NODE_VERSION = "22"

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# CSS/JS: KEIN immutable-Caching, da die Dateinamen stabil sind (kein
# Content-Hashing). Sonst behalten Browser alte Versionen nach einem Update.
# Netlify liefert ETags – Revalidierung ist billig (304 wenn unverändert).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Bilder ändern sich praktisch nie – moderates Caching ist ok.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Nur die Vokabel-App hat einen /assets/-Ordner, und dort hängt an jedem
# Dateinamen ein Content-Hash – unbegrenztes Caching ist deshalb sicher.
# (Header lassen sich in netlify.toml nicht pro Kontext setzen; für die
# Joythe-Seite läuft die Regel ins Leere, weil es dort kein /assets/ gibt.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
