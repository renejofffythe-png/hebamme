# Netlify-Konfiguration für die Vokabel-App.
#
# Diese Datei greift NUR, wenn im Netlify-Projekt das Feld "Base directory" auf
# `vokabel-app` steht. Bleibt das Feld leer — die empfohlene Einstellung —, liest
# Netlify stattdessen die netlify.toml im Repo-Root; dort erledigt der Abschnitt
# [context."vokabel-app"] dasselbe. Beide Wege führen zum selben Build, es darf
# nur nicht halb das eine und halb das andere sein: mit gesetztem Base-Verzeichnis
# würde der Befehl aus dem Root-Kontext ins Leere greifen (vokabel-app/vokabel-app).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 6 braucht Node 18+; Netlify nimmt sonst eine ältere Version.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Vite hängt Content-Hashes an die Dateinamen, deshalb ist unbegrenztes
# Caching hier sicher — ein Update erzeugt neue Namen.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
