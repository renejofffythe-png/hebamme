# Netlify-Konfiguration für die Vokabel-App.
#
# Diese Datei gilt NUR für ein Netlify-Projekt, dessen "base directory" auf
# `vokabel-app` gesetzt ist. Die netlify.toml im Repo-Root gehört zur
# Joythe-&-Richert-Website und bleibt davon unberührt — beide Projekte
# deployen aus demselben Repository, aber aus verschiedenen Ordnern.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 6 braucht Node 18+; Netlify nimmt sonst eine ältere Version.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Vite hängt Content-Hashes an die Dateinamen, deshalb ist unbegrenztes
# Caching hier sicher — ein Update erzeugt neue Namen.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
